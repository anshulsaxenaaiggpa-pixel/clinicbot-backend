{% extends "doctor/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">🏥 Doctor Login</h2>
                        <p class="text-muted">CuraSlot Doctor Dashboard</p>
                    </div>

                    <form method="POST" action="/doctor/login">
                        <div class="mb-3">
                            <label for="whatsapp_number" class="form-label">WhatsApp Number</label>
                            <input type="tel" class="form-control form-control-lg" id="whatsapp_number"
                                name="whatsapp_number" required pattern="\+[0-9]{10,15}" placeholder="+919876543210"
                                autofocus>
                            <div class="form-text">Format: +91XXXXXXXXXX</div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control form-control-lg" id="password" name="password"
                                required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Login
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <small class="text-muted">
                            Need help? Contact <a href="mailto:support@curaslot.com">support@curaslot.com</a>
                        </small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
    }

    .card {
        border-radius: 15px;
    }
</style>
{% endblock %}

{% block extra_nav %}
<!-- No nav for login page -->
{% endblock %}
