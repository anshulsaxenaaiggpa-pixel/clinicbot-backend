<!DOCTYPE html>
<html>

<head>
    <title>Admin Dashboard - CuraSlot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-4">
    <div class="container">
        <h1 class="text-primary">🏥 CuraSlot Admin Dashboard</h1>
        <p class="lead">✅ Admin panel is working!</p>

        <div class="row mt-4">
            <div class="col-md-3">
                <div class="card bg-success text-white text-center p-4">
                    <h2>2</h2>
                    <p>Active Doctors</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-white text-center p-4">
                    <h2>0</h2>
                    <p>Pending Payments</p>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <h3>Quick Links</h3>
            <div class="list-group">
                <a href="/admin/payments" class="list-group-item list-group-item-action">💰 Payments</a>
                <a href="/admin/doctors" class="list-group-item list-group-item-action">👨‍⚕️ Manage Doctors</a>
                <a href="/admin/tools/qr" class="list-group-item list-group-item-action">📱 QR Codes</a>
                <a href="/admin/audit" class="list-group-item list-group-item-action">📋 Audit Logs</a>
            </div>
        </div>

        <div class="mt-4">
            <a href="/admin/logout" class="btn btn-danger">Logout</a>
        </div>
    </div>
</body>

</html>
