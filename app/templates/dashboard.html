<!DOCTYPE html>
<html>

<head>
    <title>CuraSlot Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light p-5">
    <div class="container">
        <h1 class="display-4 text-primary mb-4">🎉 CuraSlot Dashboard LIVE!</h1>

        <div class="row mb-5">
            <div class="col-md-3">
                <div class="card bg-success text-white text-center p-4 rounded-3 shadow">
                    <h2>14</h2>
                    <p>Today's Appointments</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white text-center p-4 rounded-3 shadow">
                    <h2>₹7,200</h2>
                    <p>Monthly Revenue</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-8">
                <h3>Recent Bookings</h3>
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Patient</th>
                                <th>Time</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Pk</td>
                                <td>10:00 AM</td>
                                <td>✅ Confirmed</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="col-md-4">
                <!-- Corrected Link to Actual QR Tool Route -->
                <a href="/admin/tools/qr" class="btn btn-lg btn-primary w-100 mb-3 d-block">
                    🖼️ Generate QR Code
                </a>
                <a href="/admin/doctors" class="btn btn-outline-primary w-100 d-block">
                    Manage Doctors
                </a>
                <a href="/admin/logout" class="btn btn-outline-danger w-100 mt-3 d-block">
                    Logout
                </a>
            </div>
        </div>
    </div>
</body>

</html>
